version: '3.8'
services:
  postgres:
    image: postgres:13
    container_name: pg_salesdb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: salesdb
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d salesdb"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
